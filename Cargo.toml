[package]
name = "sticky"
version = "0.1.1"
edition = "2024"
description = "Fast post-it notes, to-dos and reminders for Windows"
license = "MIT"
repository = "https://github.com/mversion/sticky"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
global-hotkey = "0.10.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
png = "0.18.1"
winresource = "0.1.34"
